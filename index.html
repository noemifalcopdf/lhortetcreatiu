<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>L’hortet creatiu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🪴 L’hortet creatiu</h1>

  <input id="nombre" placeholder="Tu nombre" />

  <h2>📅 Horarios</h2>

  <div id="loading">Cargando...</div>
  <div id="calendar"></div>

  <!-- BONOS PUBLICOS -->
  <div id="bonosPublicos" class="hidden">
    <h2>💳 Bonos</h2>
    <div id="bonosListaPublica"></div>
  </div>

</div>

<!-- ADMIN FOOTER -->
<div id="adminPanel" class="admin">

  <div class="admin-header">
    🔐 Acceso Noemi
  </div>

  <!-- LOGIN -->
  <div id="loginBox">
    <input id="adminPass" type="password" placeholder="Contraseña admin" />
    <button id="loginAdmin">Entrar</button>
  </div>

  <!-- PANEL REAL -->
  <div id="adminContent" class="hidden">

    <h3>📌 Reservas</h3>
    <div id="adminReservas"></div>

    <h3>⏳ Bonos</h3>

    <input id="adminNombre" placeholder="Nombre alumno" />
    <input id="bonos" type="number" placeholder="Horas" />

    <label>
      <input type="checkbox" id="bonoPublico">
      Visible para alumnos
    </label>

    <button id="guardarBono">Guardar bono</button>

    <div id="bonosLista"></div>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
