<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>L’hortet creatiu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🪴 L’hortet creatiu</h1>

  <input id="nombre" placeholder="Tu nombre" />

  <!-- CALENDARIO -->
  <h2>📅 Calendario</h2>
  <div id="loading">Cargando...</div>
  <div id="calendar"></div>

  <!-- BONOS VISIBLES -->
  <h2>💳 Bonos</h2>
  <div id="bonosPublicos"></div>

  <!-- ACCESO NOEMI -->
  <h2>🔐 Acceso Noemi</h2>

  <div id="loginBox">
    <input id="adminPass" type="password" placeholder="Contraseña" />
    <button id="loginAdmin">Entrar</button>
  </div>

  <div id="adminContent" class="hidden">

    <h3>📌 Reservas</h3>
    <div id="adminReservas"></div>

    <h3>⏳ Gestión de bonos</h3>

    <input id="adminNombre" placeholder="Nombre alumno" />
    <input id="bonos" type="number" placeholder="Horas a añadir" />

    <label>
      <input type="checkbox" id="bonoPublico">
      Visible para alumnos
    </label>

    <button id="guardarBono">Guardar bono</button>

    <h4>Listado bonos</h4>
    <div id="bonosLista"></div>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
